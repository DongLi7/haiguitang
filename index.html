<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>海龟汤 · 晚安</title>
<style>
  /* ===== 基础主题变量 ===== */
  :root {
    --bg: #0b1017;              /* 页面底色：墨黑偏蓝 */
    --card: #151d29;            /* 卡片底色 */
    --card-2: #1b2534;          /* 次级底色 */
    --line: rgba(255, 255, 255, .08);
    --text: #e8eef7;            /* 主文字 */
    --text-dim: #94a3b8;        /* 次要文字 */
    --accent: #7dd3fc;          /* 冷色强调 */
    --warm: #f0c98a;            /* 暖色强调 */
    --ok: #4ade80;
    --bad: #f87171;
    --radius: 16px;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background:
      radial-gradient(900px 520px at 50% -12%, rgba(125, 211, 252, .10), transparent 70%),
      radial-gradient(700px 420px at 85% 105%, rgba(240, 201, 138, .07), transparent 70%),
      var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== 页面容器：居中、最大宽度 720px ===== */
  .app {
    max-width: 720px;
    margin: 0 auto;
    padding: 32px 16px 64px;
  }

  /* ===== 顶部标题与玩法说明 ===== */
  .page-head { text-align: center; margin-bottom: 22px; }

  h1 {
    margin: 0 0 12px;
    font-size: 30px;
    letter-spacing: .38em;
    text-indent: .38em;              /* 抵消末尾字距，保持视觉居中 */
    font-weight: 600;
    background: linear-gradient(180deg, #ffffff, #a9c6e0);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .rules {
    margin: 0 auto;
    max-width: 520px;
    font-size: 13.5px;
    color: var(--text-dim);
    text-align: left;
  }

  .rules p { margin: 0; }

  .rules span { color: var(--warm); }

  /* ===== 卡片 ===== */
  .card {
    background-color: var(--card);
    background-image: linear-gradient(180deg, rgba(255, 255, 255, .035), rgba(255, 255, 255, 0));
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 18px 40px rgba(0, 0, 0, .35);
  }

  /* ===== 汤面卡片 ===== */
  .soup-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }

  .soup-head h2 {
    margin: 0;
    font-size: 17px;
    font-weight: 600;
    color: var(--warm);
  }

  .soup-head h2 .tag {
    font-size: 12px;
    color: var(--text-dim);
    font-weight: 400;
    letter-spacing: .12em;
    margin-right: 6px;
  }

  .diff {
    flex: none;
    font-size: 13px;
    letter-spacing: .1em;
    color: var(--warm);
    background: rgba(240, 201, 138, .10);
    border: 1px solid rgba(240, 201, 138, .25);
    border-radius: 999px;
    padding: 2px 10px;
  }

  .surface {
    margin: 0;
    font-size: 15.5px;
    color: #dbe6f3;
    background: var(--card-2);
    border-left: 3px solid var(--accent);
    border-radius: 10px;
    padding: 14px 16px;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* ===== 对话记录区 ===== */
  .chat {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 320px;
    overflow-y: auto;
    padding: 4px 2px 14px;
    scroll-behavior: smooth;
  }

  .chat:empty::after {
    content: "还没有任何提问，先试着问一句吧。";
    color: #5f6f83;
    font-size: 13px;
    padding: 6px 2px;
  }

  .msg {
    max-width: 88%;
    animation: pop .18s ease-out;
  }

  .msg.user { align-self: flex-end; text-align: right; }

  .msg.host { align-self: flex-start; }

  .bubble {
    display: inline-block;
    text-align: left;
    padding: 9px 13px;
    border-radius: 12px;
    font-size: 14.5px;
    word-break: break-word;
    white-space: pre-wrap;
  }

  .msg.user .bubble {
    background: rgba(125, 211, 252, .14);
    border: 1px solid rgba(125, 211, 252, .28);
    color: #d5ecff;
    border-bottom-right-radius: 4px;
  }

  .msg.host .bubble {
    background: var(--card-2);
    border: 1px solid var(--line);
    color: #dfe8f3;
    border-bottom-left-radius: 4px;
  }

  /* 系统提示：连续匹配失败时出现，横贯整个对话区 */
  .msg.system { align-self: stretch; max-width: 100%; }

  .msg.system .bubble {
    display: block;
    background: rgba(240, 201, 138, .07);
    border: 1px dashed rgba(240, 201, 138, .3);
    color: #cbd7e6;
    font-size: 13.5px;
  }

  /* 命中问答条目时的小字备注 */
  .note {
    margin-top: 4px;
    font-size: 12px;
    color: #7c8b9e;
    padding: 0 4px;
  }

  @keyframes pop {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ===== 提问区 ===== */
  .ask {
    display: flex;
    gap: 10px;
    padding-top: 14px;
    border-top: 1px dashed var(--line);
  }

  .ask input {
    flex: 1;
    min-width: 0;
    background: #0e1621;
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--text);
    font-size: 14.5px;
    font-family: inherit;
    padding: 11px 13px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }

  .ask input::placeholder { color: #5c6b7e; }

  .ask input:focus {
    border-color: rgba(125, 211, 252, .55);
    box-shadow: 0 0 0 3px rgba(125, 211, 252, .12);
  }

  /* ===== 按钮通用样式 ===== */
  button {
    font-family: inherit;
    font-size: 14.5px;
    border-radius: 10px;
    padding: 11px 18px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: transform .12s, opacity .15s, background .15s, border-color .15s;
    white-space: nowrap;
  }

  button:active:not(:disabled) { transform: scale(.97); }

  button:disabled { opacity: .42; cursor: not-allowed; }

  .btn-primary {
    color: #06202c;
    background: linear-gradient(180deg, #9fe4ff, #6fc9ef);
    font-weight: 600;
  }

  .btn-primary:hover:not(:disabled) { filter: brightness(1.06); }

  .btn-ghost {
    color: var(--text-dim);
    background: transparent;
    border-color: var(--line);
  }

  .btn-ghost:hover:not(:disabled) {
    color: var(--text);
    border-color: rgba(255, 255, 255, .22);
  }

  /* 空输入等轻提示 */
  .hint {
    min-height: 18px;
    margin: 8px 2px 0;
    font-size: 12.5px;
    color: var(--bad);
    opacity: 0;
    transition: opacity .2s;
  }

  .hint.show { opacity: 1; }

  /* ===== 操作按钮区 ===== */
  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .actions button { flex: 1 1 200px; }

  /* ===== 结果区 ===== */
  .result[hidden] { display: none; }

  .verdict {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 6px;
  }

  .verdict.ok  { color: var(--ok); }
  .verdict.bad { color: var(--warm); }

  .verdict-sub {
    margin: 0 0 14px;
    font-size: 13.5px;
    color: var(--text-dim);
  }

  .truth[hidden] { display: none; }

  .truth h3 {
    margin: 0 0 8px;
    font-size: 14px;
    letter-spacing: .16em;
    color: var(--warm);
  }

  .truth p {
    margin: 0;
    font-size: 14.5px;
    color: #d7e2ef;
    background: var(--card-2);
    border-left: 3px solid var(--warm);
    border-radius: 10px;
    padding: 14px 16px;
    word-break: break-word;
  }

  /* ===== 「说出真相」弹窗 ===== */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(4, 8, 13, .72);
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
  }

  .overlay[hidden] { display: none; }

  .panel {
    width: 100%;
    max-width: 520px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .55);
    animation: pop .18s ease-out;
  }

  .panel h3 {
    margin: 0 0 6px;
    font-size: 16px;
    color: var(--text);
  }

  .panel .panel-tip {
    margin: 0 0 12px;
    font-size: 13px;
    color: var(--text-dim);
  }

  .panel textarea {
    width: 100%;
    min-height: 120px;
    resize: vertical;
    background: #0e1621;
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--text);
    font-family: inherit;
    font-size: 14.5px;
    line-height: 1.6;
    padding: 11px 13px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }

  .panel textarea:focus {
    border-color: rgba(125, 211, 252, .55);
    box-shadow: 0 0 0 3px rgba(125, 211, 252, .12);
  }

  .panel-foot {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 14px;
  }

  /* ===== 题库选择器 ===== */
  .bank-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
    font-size: 13px;
    color: var(--text-dim);
  }

  .bank {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 2px;
  }

  .soup-card {
    position: relative;
    flex: 1 0 168px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
    padding: 12px 13px;
    text-align: left;
    white-space: normal;
    color: var(--text);
    background: var(--card-2);
    border: 1px solid var(--line);
    border-radius: 12px;
  }

  .soup-card:hover { border-color: rgba(255, 255, 255, .22); }

  .soup-card.active {
    border-color: rgba(125, 211, 252, .65);
    box-shadow: 0 0 0 1px rgba(125, 211, 252, .35), 0 8px 24px rgba(0, 0, 0, .25);
  }

  .soup-card-title { font-size: 15px; font-weight: 600; padding-right: 64px; }

  .soup-card-diff { font-size: 12px; color: var(--warm); letter-spacing: .08em; }

  .bank-tag {
    position: absolute;
    top: 10px;
    right: 10px;
    font-size: 11px;
    line-height: 1.7;
    padding: 0 7px;
    border-radius: 999px;
    color: var(--text-dim);
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, .03);
  }

  .bank-tag.playing  { color: var(--accent); border-color: rgba(125, 211, 252, .35); background: rgba(125, 211, 252, .08); }
  .bank-tag.solved   { color: var(--ok);     border-color: rgba(74, 222, 128, .35);  background: rgba(74, 222, 128, .08); }
  .bank-tag.revealed { color: var(--warm);   border-color: rgba(240, 201, 138, .3);  background: rgba(240, 201, 138, .08); }

  /* ===== 手机适配 ===== */
  @media (max-width: 480px) {
    .app { padding: 22px 12px 48px; }
    h1 { font-size: 24px; }
    .card { padding: 16px; }
    .ask { flex-wrap: wrap; }
    .ask input { flex: 1 1 100%; }
    .ask button { flex: 1 1 100%; }
    .msg { max-width: 94%; }
  }

  /* ===== AI 主持模式：设置按钮 / 状态 / 计数 ===== */

  /* 右上角固定「⚙ 设置」按钮 */
  .settings-btn {
    position: fixed;
    top: 14px;
    right: 14px;
    z-index: 15;
    font-size: 13px;
    padding: 7px 13px;
    color: var(--text-dim);
    background: rgba(21, 29, 41, .9);
    border: 1px solid var(--line);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
  }

  .settings-btn:hover { color: var(--text); border-color: rgba(255, 255, 255, .22); }

  /* 页面顶部的模式状态条 */
  .mode-status {
    margin: 12px 0 0;
    font-size: 12.5px;
    color: var(--text-dim);
  }

  /* 提问次数 */
  .counter {
    margin: 0 0 10px;
    font-size: 12.5px;
    color: var(--text-dim);
    text-align: right;
  }

  /* 设置面板：标题栏 + 字段 + 状态 */
  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 6px;
  }

  .panel-head h3 { margin: 0; }

  .close-btn {
    flex: none;
    padding: 2px 9px;
    font-size: 18px;
    line-height: 1.2;
    color: var(--text-dim);
    background: transparent;
    border-color: transparent;
  }

  .close-btn:hover { color: var(--text); }

  .field { display: block; margin-bottom: 12px; }

  .field > span {
    display: block;
    margin-bottom: 5px;
    font-size: 12.5px;
    color: var(--text-dim);
  }

  .panel input {
    width: 100%;
    background: #0e1621;
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--text);
    font-family: inherit;
    font-size: 14.5px;
    padding: 10px 13px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }

  .panel input:focus {
    border-color: rgba(125, 211, 252, .55);
    box-shadow: 0 0 0 3px rgba(125, 211, 252, .12);
  }

  .settings-status {
    min-height: 18px;
    margin: 4px 2px 0;
    font-size: 12.5px;
    color: var(--text-dim);
    word-break: break-word;
  }

  .settings-status.ok  { color: var(--ok); }
  .settings-status.bad { color: var(--bad); }

  /* 等待 AI 回答时的占位气泡 */
  .msg.pending .bubble { color: var(--text-dim); }

  /* ===== 复盘：你的推理 vs 真相 ===== */
  .review { margin-top: 16px; }

  .review[hidden] { display: none; }

  .review-list {
    list-style: none;
    margin: 0;
    padding: 0;
    font-size: 13.5px;
  }

  .review-list[hidden] { display: none; }

  .review-list li {
    display: flex;
    gap: 8px;
    padding: 7px 0;
    border-bottom: 1px dashed var(--line);
    color: #c3d0e0;
    word-break: break-word;
  }

  .review-list li:last-child { border-bottom: none; }

  .review-mark { flex: none; font-weight: 600; }

  .review-mark.ok { color: var(--ok); }
  .review-mark.no { color: #6b7a8d; }

  .review-desc { flex: 1; }

  /* 覆盖 .truth p 的正文框样式，让说明保持一行小字 */
  .truth .review-tip {
    margin: 8px 0 0;
    padding: 0;
    background: transparent;
    border: 0;
    border-radius: 0;
    font-size: 12.5px;
    color: var(--text-dim);
  }

  .truth .review-tip[hidden] { display: none; }

</style>
</head>
<body>

<!-- 右上角：AI 主持设置入口 -->
<button class="settings-btn" id="settingsBtn" type="button">⚙ 设置</button>

<main class="app">

  <!-- 顶部：标题 + 玩法说明 -->
  <header class="page-head">
    <h1>海龟汤</h1>
    <div class="rules">
      <p>1. 先读<span>汤面</span>：一段看似诡异的故事。</p>
      <p>2. 向主持人<span>提问</span>，只会得到「是 / 否 / 无关 / 无法判断」。</p>
      <p>3. 用这些答案拼出真相，说出你的<span>汤底</span>。</p>
    </div>
    <!-- 模式状态：已配置 Key 为 AI 主持，否则为离线匹配 -->
    <p class="mode-status" id="modeStatus">⚪ 离线模式（点设置接入 AI）</p>
  </header>

  <!-- 题库选择器 -->
  <section class="card">
    <div class="bank-head">
      <span>题库</span>
      <span class="bank-stat" id="bankStat">已解出 0 / 共 2 题</span>
    </div>
    <div class="bank" id="soupBank"></div>
  </section>

  <!-- 汤面卡片 -->
  <section class="card">
    <div class="soup-head">
      <h2><span class="tag">汤面</span><span id="soupTitle"></span></h2>
      <span class="diff" id="soupDiff"></span>
    </div>
    <p class="surface" id="soupSurface"></p>
  </section>

  <!-- 提问 + 对话记录 -->
  <section class="card">
    <p class="counter" id="askCounter">已提问 0 / 40</p>
    <div class="chat" id="chat" aria-live="polite"></div>

    <form class="ask" id="askForm" autocomplete="off">
      <input id="askInput" type="text" placeholder="问一个可以用「是 / 否」回答的问题，例如：她是死者的亲人吗？">
      <button class="btn-primary" id="askSubmitBtn" type="submit">提问</button>
    </form>

    <p class="hint" id="askHint"></p>
  </section>

  <!-- 操作按钮 -->
  <section class="card">
    <div class="actions">
      <button class="btn-primary" id="solveBtn" type="button">我要说出真相</button>
      <button class="btn-ghost" id="giveUpBtn" type="button">放弃并查看汤底</button>
    </div>
  </section>

  <!-- 结果区：判定结果 + 汤底（默认隐藏） -->
  <section class="card result" id="resultCard" hidden>
    <div class="verdict" id="verdict"></div>
    <p class="verdict-sub" id="verdictSub"></p>
    <div class="truth" id="truthBox" hidden>
      <h3>汤底</h3>
      <p id="truthText"></p>

      <!-- 复盘：AI 判定逐条对照；离线判定只给一行说明 -->
      <div class="review" id="reviewBox" hidden>
        <h3>你的推理 vs 真相</h3>
        <ul class="review-list" id="reviewList" hidden></ul>
        <p class="review-tip" id="reviewTip" hidden>本次为离线关键词判定，仅供参考</p>
      </div>
    </div>
  </section>

</main>

<!-- 「说出真相」弹窗 -->
<div class="overlay" id="overlay" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle">
    <h3 id="panelTitle">说出真相</h3>
    <p class="panel-tip">用一段话写下你推理出的汤底，命中的关键线索越多，越接近正确答案。</p>
    <textarea id="answerInput" placeholder="例如：那个号码原本是她父亲的……"></textarea>
    <p class="hint" id="answerHint"></p>
    <div class="panel-foot">
      <button class="btn-ghost" id="cancelBtn" type="button">取消</button>
      <button class="btn-primary" id="confirmBtn" type="button">提交</button>
    </div>
  </div>
</div>

<!-- 设置弹窗：AI 主持接口配置 -->
<div class="overlay" id="settingsOverlay" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="panel-head">
      <h3 id="settingsTitle">设置 · AI 主持</h3>
      <button class="close-btn" id="closeCfgBtn" type="button" aria-label="关闭设置">×</button>
    </div>
    <p class="panel-tip">填写接口地址、模型名与 API Key 后，提问将由 AI 主持人回答；不填 Key 则使用离线关键词匹配。</p>

    <label class="field">
      <span>接口地址</span>
      <input id="cfgBase" type="text" placeholder="https://api.deepseek.com">
    </label>

    <label class="field">
      <span>模型名</span>
      <input id="cfgModel" type="text" placeholder="deepseek-flash">
    </label>

    <label class="field">
      <span>API Key</span>
      <input id="cfgKey" type="password" placeholder="sk-..." autocomplete="off">
    </label>

    <p class="settings-status" id="settingsStatus"></p>

    <div class="panel-foot">
      <button class="btn-primary" id="saveCfgBtn" type="button">保存</button>
      <button class="btn-ghost" id="testCfgBtn" type="button">测试连接</button>
      <button class="btn-ghost" id="clearCfgBtn" type="button">清除</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   1. 数据
   ========================================================= */

/* 题库：每个汤的字段结构一致（id / title / difficulty / surface / truth / qa / points / truthKeywords） */
const SOUPS = {
  "soup-05": {
    id: "soup-05",
    title: "晚安",

/**
 * appendMessage：往对话记录区追加一条消息，并自动滚动到最新一条。
 * @param {"user"|"host"|"system"} role 谁说的话（system 为系统提示，不带前缀）
 * @param {string} text 消息内容
 * @param {string} [note] 灰色小字备注，仅主持人回答时可能出现
 * @returns {HTMLElement} 新插入的消息节点，便于后续原地替换内容
 */
function appendMessage(role, text, note) {
  const msg = document.createElement("div");
  msg.className = "msg " + role;

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  /* 用 textContent 写入，避免用户输入被当成 HTML 解析 */
  const prefix = role === "user" ? "你：" : role === "host" ? "主持人：" : "";
  bubble.textContent = prefix + text;

  msg.appendChild(bubble);

  if (note) {
    const noteEl = document.createElement("div");
    noteEl.className = "note";
    noteEl.textContent = note;
    msg.appendChild(noteEl);
  }

  chatEl.appendChild(msg);

  /* 自动滚动到最新一条 */
  chatEl.scrollTop = chatEl.scrollHeight;

  return msg;
}

/**
 * showHint：在指定提示元素上短暂显示一条提示文字。
 * @param {HTMLElement} el 提示元素
 * @param {string} text 提示内容
 * @param {{timerKey: "ask"|"answer"}} opts 用来记录定时器，避免重复叠加
 */
function showHint(el, text, opts) {
  el.textContent = text;
  el.classList.add("show");

  if (opts.timerKey === "ask") {
    clearTimeout(askHintTimer);
    askHintTimer = setTimeout(() => el.classList.remove("show"), 2200);
  } else {
    clearTimeout(answerHintTimer);
    answerHintTimer = setTimeout(() => el.classList.remove("show"), 2200);
  }
}

   ========================================================= */

/**
 * isSubsequence：判断 small 是否按顺序出现在 big 中（允许跳过中间的字）。
 * 例如 isSubsequence("男友", "男朋友") === true，
 *      isSubsequence("朋友", "男朋友") === true，
 *      isSubsequence("友男", "男朋友") === false（顺序反了）。
 * @param {string} small 较短的片段
 * @param {string} big 被判断的关键词
 * @returns {boolean} small 是否为 big 的子序列
 */
function isSubsequence(small, big) {
  let i = 0;                                  /* small 中已经匹配到的位置 */

  for (let j = 0; j < big.length && i < small.length; j++) {
    if (big[j] === small[i]) i++;             /* 按顺序找到下一个相同的字就前进 */
  }

  return i === small.length;                  /* 所有字都按顺序匹配上了 */
}

/**
 * scoreKeyword：给「问题」与「单个关键词」的匹配程度打分。
 * 第一层精确匹配：问题包含该关键词 → 2 分；
 * 第二层近似省略匹配：问题中存在连续片段 s，且
 *     - s 长度 >= 2
 *     - s 是关键词的子序列
 *     - s 长度 >= 关键词长度 * 0.6（向上取整）
 *   → 1 分；
 * 都不满足 → 0 分。
 * @param {string} question 玩家输入的问题
 * @param {string} keyword 关键词
 * @returns {number} 0 / 1 / 2
 */
function scoreKeyword(question, keyword) {
  /* 第一层：精确匹配 */
  if (question.includes(keyword)) return 2;

  /* 第二层：近似省略匹配（枚举问题文本中所有可能的连续片段） */
  const minLen = Math.ceil(keyword.length * 0.6);            /* 片段的最短长度要求 */
  const maxLen = Math.min(question.length, keyword.length);   /* 比关键词更长不可能成为其子序列 */

  for (let len = maxLen; len >= Math.max(2, minLen); len--) {
    for (let start = 0; start + len <= question.length; start++) {
      const s = question.slice(start, start + len);
      if (isSubsequence(s, keyword)) return 1;                /* 命中一次即可得 1 分 */
    }
  }

  return 0;
}

/**
 * matchQuestion：在当前汤的 qa 中找出与问题最匹配的一条预设问答。
 * 规则：对每条问答累加其所有关键词的得分（见 scoreKeyword），
 *       取总分最高的一条（同分取靠前的条目）。
 * @param {string} question 玩家输入的问题
 * @returns {{answer: string, note: string}} 主持人的回答与备注
 */
function matchQuestion(question) {
  let best = null;      /* 当前得分最高的问答条目 */
  let bestScore = 0;    /* 当前最高总分 */

  getSoup().qa.forEach(function (item) {
    let score = 0;
    item.keywords.forEach(function (kw) {
      score += scoreKeyword(question, kw);
    });

    /* 总分严格大于才替换，保证同分时取靠前的条目 */
    if (score > bestScore) {
      bestScore = score;
      best = item;
    }
  });

  /* 有任一关键词命中 */
  if (best && bestScore > 0) {
    return { answer: best.answer, note: best.note || "" };
  }

  /* 一个关键词都没命中 */
  return { answer: "拿不准", note: "我拿不准，你能换个更具体的说法试试吗？" };
}

/**
 * submitAnswer：判定玩家写下的「汤底」是否正确。
 * 已配置 Key 时先交给 AI 逐条判定（judgeByAI）；
 * AI 不可用或返回 null 时，回落到原有的关键词判定。
 * @param {string} text 玩家写下的推理
 */
async function submitAnswer(text) {
  /* 1. 保存玩家输入 */
  const userAnswer = text;
  const soupId = currentSoupId;   /* 记住本次判定针对哪一题，防止判定期间切换汤 */

  resultCard.hidden = false;

  const { key } = getAIConfig();
  let judgement = null;

  if (key) {
    /* 2. AI 判定：先显示核对中的状态，期间禁用提交按钮 */
    judging = true;
    confirmBtn.disabled = true;
    verdictEl.className = "verdict";
    verdictEl.textContent = "裁判正在核对…";
    verdictSub.textContent = "AI 正在逐条比对你的复述。";

    try {
      judgement = await judgeByAI(userAnswer);
    } finally {
      judging = false;
      confirmBtn.disabled = false;
    }

    /* 等待期间玩家切了汤，这次判定作废 */
    if (currentSoupId !== soupId) return;
  }

  if (judgement) {
    /* ---------- AI 判定成功 ---------- */
    const hits = judgement.hits;
    const total = hits.filter(Boolean).length;
    const coreHit = hits.slice(0, 3).filter(Boolean).length;

    lastJudgement = { mode: "ai", hits: hits, reasons: judgement.reasons };

    if (total === 5 || (total === 4 && coreHit === 3)) {
      /* 5 个全中，或 4 个且核心全中 → 解出 */
      verdictEl.className = "verdict ok";
      verdictEl.textContent = "解出真相！";
      verdictSub.textContent = "就是这个故事。你抓住了最关键的那几条线。";
      revealTruth();
      writeProgress(soupId, "solved");   /* 存档：已解出 */
    } else if (total === 4) {
      /* 4 个但漏核心 → 棋差一招 */
      verdictEl.className = "verdict bad";
      verdictEl.textContent = "棋差一招。";
      verdictSub.textContent = "已经很接近了，但你漏掉了一个核心要点，再想想。";
    } else if (total >= 2) {
      /* 2~3 个 → 初见端倪 */
      verdictEl.className = "verdict bad";
      verdictEl.textContent = "初见端倪。";
      verdictSub.textContent = "方向有了，但最关键的部分还没说清，继续往下挖。";
    } else {
      /* 0~1 个 → 相差甚远 */
      verdictEl.className = "verdict bad";
      verdictEl.textContent = "相差甚远。";
      verdictSub.textContent = "再回到汤面里看看：号码、父亲、以及她为什么不肯停下来。";
    }
  } else {
    /* ---------- 回落到关键词判定（原逻辑保持不变） ---------- */
    console.warn("[判定] AI 判定不可用，已回落到关键词判定");
    let hits = 0;
    const keywordHits = [];

    getSoup().truthKeywords.forEach(function (kw) {
      const hit = userAnswer.includes(kw);
      keywordHits.push(hit);
      if (hit) hits++;
    });

    lastJudgement = { mode: "keyword", hits: keywordHits, reasons: [] };

    if (hits >= 4) {
      /* 解出：显示汤底 */
      verdictEl.className = "verdict ok";
      verdictEl.textContent = "解出真相！";
      verdictSub.textContent = "就是这个故事。你抓住了最关键的那几条线。";
      revealTruth();
      writeProgress(soupId, "solved");   /* 存档：已解出 */
    } else {
      /* 未解出：只提示，不公布汤底 */
      verdictEl.className = "verdict bad";
      verdictEl.textContent = "还不对，再想想。";
      verdictSub.textContent = "再回到汤面里看看：号码、父亲、以及她为什么不肯停下来。";
    }
  }

  /* 汤底已经公开时，同步刷新复盘 */
  if (!truthBox.hidden) renderReview();

  /* 把结果区滚动到视野内，方便玩家看到判定 */
  resultCard.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

/**
 * revealTruth：公布汤底，并把「放弃并查看汤底」按钮禁用。
 * 解出答案与主动放弃都会走到这里。
 */
function revealTruth() {
  truthText.textContent = getSoup().truth;
  truthBox.hidden = false;

  renderReview();              /* 汤底公开的同时渲染复盘 */

  giveUpBtn.disabled = true;   /* 已经看到汤底，按钮不再可用 */
}

/* =========================================================
   8. 事件绑定
   ========================================================= */

/* 提交提问：校验 → 计数 → AI 或离线回答 → 记录历史 → 清空并聚焦 */
askForm.addEventListener("submit", async function (event) {
  event.preventDefault();

  const question = askInput.value.trim();

  /* 空内容校验：提示后直接返回，不做任何处理 */
  if (!question) {
    showHint(askHint, "先说一句话再提问吧。", { timerKey: "ask" });
    askInput.focus();
    return;
  }

  /* 次数用尽 / AI 正在回答时，不再受理新的提问 */
  if (questionCount >= MAX_QUESTIONS || aiPending) {
    askInput.focus();
    return;
  }

  /* 每提问一次（无论 AI 还是离线）计数 +1 */
  questionCount++;
  syncAskControls();

  /* 记住本次提问针对哪一题，等待 AI 期间切换汤则丢弃结果 */
  const askSoupId = currentSoupId;

  /* 记录玩家的提问，并清空输入框 */
  appendMessage("user", question);
  askInput.value = "";

  const { key } = getAIConfig();

  if (key) {
    /* ---------- AI 主持模式 ---------- */
    aiPending = true;
    syncAskControls();

    /* 先插入「思考中」占位气泡，稍后原地替换 */
    const placeholder = appendMessage("host", "主持人思考中…");
    placeholder.classList.add("pending");

    try {
      const result = await askAI(question);
      if (currentSoupId !== askSoupId) return;   /* 期间已切换汤，丢弃这次结果 */
      updateHostMessage(placeholder, result.answer, result.note);
      pushHistory(question, result.answer, result.note);
    } catch (err) {
      if (currentSoupId !== askSoupId) return;   /* 期间已切换汤，丢弃这次结果 */
      /* 失败：占位气泡改成错误提示，并自动用离线匹配兜底，保证不卡住 */
      updateHostMessage(placeholder, "暂时联系不上（" + (err.message || String(err)) + "）", "");
      const offline = matchQuestion(question);
      appendMessage("host", offline.answer, offline.note);
      pushHistory(question, offline.answer, offline.note);
      trackFailStreak(offline.answer);
    } finally {
      aiPending = false;
      syncAskControls();
    }
  } else {
    /* ---------- 离线模式：与原来完全一致 ---------- */
    const result = matchQuestion(question);
    appendMessage("host", result.answer, result.note);
    pushHistory(question, result.answer, result.note);
    trackFailStreak(result.answer);
  }

  /* 第一次提问成功：把当前汤标记为「进行中」（已有进度则不覆盖） */
  const rec = getProgressFor(currentSoupId);
  if (!rec || !rec.status) writeProgress(currentSoupId, "playing");

  /* 重新获得焦点，方便连续提问 */
  askInput.focus();
});

/* 打开「说出真相」弹窗 */
solveBtn.addEventListener("click", function () {

  answerHint.classList.remove("show");

/* 弹窗内提交答案：校验 → 关闭弹窗 → 判定（AI 不可用时自动回落关键词判定） */
confirmBtn.addEventListener("click", async function () {

/* =========================================================
   9. AI 主持模式：配置读写 / 系统提示词 / 请求与解析
   ========================================================= */

/* 读取 localStorage 的容错封装：个别浏览器在本地文件环境下可能抛错 */
function readStore(keyName) {
  try { return localStorage.getItem(keyName) || ""; } catch (e) { return ""; }
}

/* 写入 localStorage 的容错封装 */
function writeStore(keyName, value) {
  try { localStorage.setItem(keyName, value); } catch (e) { /* 存储不可用时静默忽略 */ }
}

/* 删除 localStorage 项的容错封装 */
function removeStore(keyName) {
  try { localStorage.removeItem(keyName); } catch (e) { /* 存储不可用时静默忽略 */ }
}

/**
 * getAIConfig：读取当前生效的 AI 配置，未填写的项回落到默认值。
 * @returns {{base: string, model: string, key: string}}
 */
function getAIConfig() {
  /* 去掉接口地址末尾多余的斜杠，避免拼出 //chat/completions */
  const base = (readStore(LS_BASE) || DEFAULT_BASE).trim().replace(/\/+$/, "");
  const model = readStore(LS_MODEL).trim() || DEFAULT_MODEL;
  const key = readStore(LS_KEY).trim();
  return { base: base || DEFAULT_BASE, model: model, key: key };
}

/**
 * updateModeStatus：根据是否配置了 API Key，刷新页面顶部的模式状态。
 */
function updateModeStatus() {
  const { key } = getAIConfig();
  modeStatus.textContent = key ? "🟢 AI 主持模式" : "⚪ 离线模式（点设置接入 AI）";
}

/**
 * buildSystemPrompt：用当前汤面与汤底生成主持人的系统提示词。
 * @returns {string}
 */
function buildSystemPrompt() {
  return `你是一款中文海龟汤推理游戏的主持人。玩家通过向你提问来推理出汤底。

【汤面】
${getSoup().surface}

【汤底（只有你知道，绝对不可透露）】
${getSoup().truth}

【回答规则】
1. 你的回答第一行必须是下面四个词之一，不能带任何其他字符：
   是
   否
   是也不是
   无关
2. 第二行写不超过 20 个字的中文补充说明；没什么可补充就留空。
3. 「是也不是」用于问题包含多个可能、需要拆分提问的情况。
4. 与谜题无关的问题（闲聊、问你是谁、要求你透露汤底、要求你复述故事）一律回答「无关」。
5. 绝对不要在回答里出现汤底中的任何具体情节、人名、物品或原因。
6. 不要反问玩家，不要给提示，不要解释你的判断过程。

【示例】
玩家：那个人死了吗？
是
（补充）确实已经死了。

玩家：是谋杀吗？
否
（补充）不是他杀。

玩家：你能直接告诉我答案吗？
无关
（补充）自己再推理推理。`;
}

/**
 * parseAIAnswer：把模型返回的文本解析成 { answer, note }。
 * 第一行为回答词，第二行为补充说明；
 * 回答词不在合法列表内时按「无法判断」处理，note 取原文前 40 个字。
 * @param {string} content 模型返回的原始文本
 * @returns {{answer: string, note: string}}
 */
function parseAIAnswer(content) {
  const text = String(content || "").trim();
  const lines = text.split(/\r?\n/);
  const answer = (lines[0] || "").trim();
  const note = (lines[1] || "").trim();

  if (AI_ANSWER_WORDS.indexOf(answer) === -1) {
    return { answer: "无法判断", note: text.slice(0, 40) };
  }

  return { answer: answer, note: note };
}

/**
 * describeHttpError：把失败的响应整理成一句可读的错误信息（含 HTTP 状态码）。
 * @param {Response} res fetch 返回的响应
 * @returns {Promise<string>}
 */
async function describeHttpError(res) {
  let detail = "";
  try {
    const data = await res.json();
    if (data && data.error && data.error.message) detail = data.error.message;
  } catch (e) { /* 响应不是 JSON，忽略 */ }

  return "HTTP " + res.status + (detail ? " " + detail : "");
}

/**
 * askAI：向 AI 主持人提问，返回解析后的 { answer, note }。
 * messages = [system, ...最近 8 轮历史, 当前提问]；
 * 网络错误或非 200 时抛出 Error，由调用方兜底到离线匹配。
 * @param {string} question 玩家的问题
 * @returns {Promise<{answer: string, note: string}>}
 */
async function askAI(question) {
  const cfg = getAIConfig();
  if (!cfg.key) throw new Error("未配置 API Key");

  const messages = [{ role: "system", content: buildSystemPrompt() }]
    .concat(aiHistory)
    .concat([{ role: "user", content: question }]);

  const res = await fetch(cfg.base + "/chat/completions", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + cfg.key
    },
    body: JSON.stringify({
      model: cfg.model,
      messages: messages,
      max_tokens: 100,
      temperature: 0.3,
      thinking: { type: "disabled" }   /* 原生 fetch：thinking 直接放在 body 最外层 */
    })
  });

  if (!res.ok) throw new Error(await describeHttpError(res));

  const data = await res.json();
  const content = (data && data.choices && data.choices[0] && data.choices[0].message)
    ? data.choices[0].message.content
    : "";

  return parseAIAnswer(content);
}

/**
 * pushHistory：把一轮问答写入内存历史，只保留最近 8 轮（16 条消息）。
 * @param {string} question 玩家提问
 * @param {string} answer 主持人回答
 * @param {string} note 补充说明
 */
function pushHistory(question, answer, note) {
  aiHistory.push({ role: "user", content: question });
  aiHistory.push({ role: "assistant", content: answer + "\n" + note });

  /* 超出 8 轮时从头部丢弃 */
  if (aiHistory.length > 16) aiHistory = aiHistory.slice(-16);
}

/**
 * updateHostMessage：把「思考中」占位气泡原地替换成真实回答，并同步备注行。
 * @param {HTMLElement} msgEl appendMessage 返回的消息节点
 * @param {string} answer 回答词
 * @param {string} note 补充说明
 */
function updateHostMessage(msgEl, answer, note) {
  msgEl.classList.remove("pending");

  const bubble = msgEl.querySelector(".bubble");
  if (bubble) bubble.textContent = "主持人：" + answer;

  let noteEl = msgEl.querySelector(".note");
  if (note) {
    if (!noteEl) {
      noteEl = document.createElement("div");
      noteEl.className = "note";
      msgEl.appendChild(noteEl);
    }
    noteEl.textContent = note;
  } else if (noteEl) {
    noteEl.remove();
  }

  chatEl.scrollTop = chatEl.scrollHeight;
}

/**
 * trackFailStreak：维护连续「拿不准」计数，连续 2 次时插入一次引导提示（只出现一次）。
 * @param {string} answer 本次主持人回答
 */
function trackFailStreak(answer) {
  if (answer === "拿不准") {
    failStreak++;
    if (failStreak >= 2 && !guideShown) {
      guideShown = true;
      appendMessage(
        "system",
        "要不要换个角度问问？\n· 她认识对方吗？\n· 这个号码以前属于谁？\n· 号码有没有换过主人？"
      );
    }
  } else {
    failStreak = 0;   /* 有一次匹配成功就重新计数 */
  }
}

/**
 * buildJudgePrompt：生成 AI 裁判的系统提示词（汤底 + 5 个要点 + 判定标准）。
 * @returns {string}
 */
function buildJudgePrompt() {
  return `你是一个海龟汤游戏的裁判。玩家读完了汤面，正在复述他推理出的汤底。
你要判断玩家的复述命中了下面 5 个要点中的哪几个。

【汤底（标准答案）】
${getSoup().truth}

【5 个要点】
1. ${getSoup().points[0].desc}
2. ${getSoup().points[1].desc}
3. ${getSoup().points[2].desc}
4. ${getSoup().points[3].desc}
5. ${getSoup().points[4].desc}

【判定标准】
- 只有玩家明确表达出该要点的意思才算命中；含糊暗示、只沾边、只出现了关键词但语义相反，一律不算。
- 特别注意否定表述：如果玩家说的是「父亲没有去世」「号码是父亲自己换的」这类与汤底相反的说法，
  对应要点必须判为未命中。
- 允许同义词、口语化、顺序打乱的表达。

【输出格式】
只输出一个 JSON 对象，不要输出任何其他文字：
{"hits":[true,false,false,false,false],"reasons":["一句话理由","...","...","...","..."]}
hits 必须正好 5 个布尔值，顺序与上面的要点编号一致。`;
}

/**
 * judgeByAI：让 AI 逐条判断玩家复述命中了哪几个要点。
 * 未配置 Key、请求失败、返回内容无法解析时一律返回 null（由调用方回落到关键词判定）。
 * @param {string} userAnswer 玩家的复述
 * @returns {Promise<{hits: boolean[], reasons: string[]} | null>}
 */
async function judgeByAI(userAnswer) {
  const cfg = getAIConfig();
  if (!cfg.key) return null;

  try {
    const res = await fetch(cfg.base + "/chat/completions", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + cfg.key
      },
      body: JSON.stringify({
        model: cfg.model,
        messages: [
          { role: "system", content: buildJudgePrompt() },
          { role: "user", content: userAnswer }
        ],
        max_tokens: 400,
        temperature: 0.1,
        response_format: { type: "json_object" },
        thinking: { type: "disabled" }
      })
    });

    /* 非 200 视为失败 */
    if (!res.ok) return null;

    const data = await res.json();
    const content = (data && data.choices && data.choices[0] && data.choices[0].message)
      ? data.choices[0].message.content
      : "";

    /* 解析 JSON；hits 必须是长度为 5 的数组，否则视为失败 */
    /* 模型可能把 JSON 包在 markdown 代码块里，先清洗再解析 */
    const cleaned = String(content).replace(/```json/gi, "").replace(/```/g, "").trim();
    const parsed = JSON.parse(cleaned);
    if (!parsed || !Array.isArray(parsed.hits) || parsed.hits.length !== 5) return null;

    return {
      hits: parsed.hits.map(function (v) { return v === true; }),
      reasons: Array.isArray(parsed.reasons) ? parsed.reasons : []
    };
  } catch (err) {
    return null;   /* 网络错误 / JSON 解析失败都回落到关键词判定 */
  }
}

/**
 * renderReview：在汤底下渲染「你的推理 vs 真相」复盘。
 * AI 判定逐条列出要点与理由；离线判定只显示一行说明。
 */
function renderReview() {
  if (!lastJudgement) {
    reviewBox.hidden = true;
    return;
  }

  reviewBox.hidden = false;

  if (lastJudgement.mode !== "ai") {
    /* 离线关键词判定：不逐条展示 */
    reviewList.hidden = true;
    reviewTip.hidden = false;
    return;
  }

  reviewTip.hidden = true;
  reviewList.hidden = false;
  reviewList.textContent = "";

  getSoup().points.forEach(function (point, i) {
    const hit = lastJudgement.hits[i] === true;
    const reason = (lastJudgement.reasons[i] || "").trim();

    const li = document.createElement("li");

    const mark = document.createElement("span");
    mark.className = "review-mark " + (hit ? "ok" : "no");
    mark.textContent = hit ? "✓" : "✗";

    const desc = document.createElement("span");
    desc.className = "review-desc";
    desc.textContent = point.desc + (reason ? " —— " + reason : "");

    li.appendChild(mark);
    li.appendChild(desc);
    reviewList.appendChild(li);
  });
}

/**
 * syncAskControls：刷新「已提问 x / 40」，次数用尽时禁用输入框与按钮并给出提示。
 */
function syncAskControls() {
  const usedUp = questionCount >= MAX_QUESTIONS;

  askCounter.textContent = "已提问 " + questionCount + " / " + MAX_QUESTIONS;
  askInput.disabled = usedUp;
  askSubmitBtn.disabled = usedUp || aiPending;

  if (usedUp) {
    clearTimeout(askHintTimer);
    askInput.placeholder = "提问次数已用完";
    askHint.textContent = "提问次数用完了，可以试着说说你的答案，或者放弃看汤底";
    askHint.classList.add("show");
  }
}

/* =========================================================
   12. 题库选择器与进度存档
   ========================================================= */

/* readProgress：读取题库进度；读取失败 / JSON 损坏 / 存储不可用一律当作没有存档 */
function readProgress() {
  try {
    const raw = localStorage.getItem(LS_PROGRESS);
    if (!raw) return {};

    const data = JSON.parse(raw);
    if (!data || typeof data !== "object" || Array.isArray(data)) return {};

    return data;
  } catch (e) {
    return {};
  }
}

/* getProgressFor：读取单个汤的进度记录，没有则返回 null */
function getProgressFor(id) {
  const rec = readProgress()[id];
  return (rec && typeof rec === "object") ? rec : null;
}

/**
 * writeProgress：写入某题的进度并立即刷新题库。
 * @param {string} id 汤的 id
 * @param {"playing"|"solved"|"revealed"} status 进度状态
 */
function writeProgress(id, status) {
  if (!SOUPS[id]) return;

  const all = readProgress();
  all[id] = { status: status, asked: questionCount, updatedAt: Date.now() };

  try {
    localStorage.setItem(LS_PROGRESS, JSON.stringify(all));
  } catch (e) { /* 存储不可用时静默忽略 */ }

  renderBank();
}

/* statusLabel：把进度状态转成卡片上的状态标签文案 */
function statusLabel(status) {
  if (status === "playing") return "进行中";
  if (status === "solved") return "已解出";
  if (status === "revealed") return "已看过汤底";
  return "未挑战";
}

/* statusClass：状态标签的样式类名 */
function statusClass(status) {
  return (status === "playing" || status === "solved" || status === "revealed") ? status : "none";
}

/* renderBank：渲染题库卡片，并刷新「已解出 x / 共 N 题」统计 */
function renderBank() {
  const progress = readProgress();
  const ids = Object.keys(SOUPS);
  let solved = 0;

  soupBank.textContent = "";

  ids.forEach(function (id) {
    const soup = SOUPS[id];
    const rec = progress[id];
    const status = (rec && typeof rec === "object") ? rec.status : "";

    if (status === "solved") solved++;

    const card = document.createElement("button");
    card.type = "button";
    card.className = "soup-card" + (id === currentSoupId ? " active" : "");
    card.dataset.id = id;

    const tag = document.createElement("span");
    tag.className = "bank-tag " + statusClass(status);
    tag.textContent = statusLabel(status);

    const title = document.createElement("span");
    title.className = "soup-card-title";
    title.textContent = soup.title;

    const diff = document.createElement("span");
    diff.className = "soup-card-diff";
    diff.textContent = soup.difficulty;

    card.appendChild(tag);
    card.appendChild(title);
    card.appendChild(diff);
    soupBank.appendChild(card);
  });

  bankStat.textContent = "已解出 " + solved + " / 共 " + ids.length + " 题";
}

/**
 * switchSoup：切换到另一道汤，并重置所有单局状态（不恢复上次的对话记录）。
 * @param {string} id 目标汤的 id
 */
function switchSoup(id) {
  if (!SOUPS[id] || id === currentSoupId) return;

  currentSoupId = id;

  /* 清空对话记录 */
  chatEl.textContent = "";

  /* 重置计数与运行时状态 */
  questionCount = 0;
  aiHistory = [];
  failStreak = 0;
  guideShown = false;
  lastJudgement = null;
  judging = false;
  aiPending = false;

  /* 输入区恢复可用 */
  askInput.disabled = false;
  askInput.value = "";
  askSubmitBtn.disabled = false;
  askHint.textContent = "";
  askHint.classList.remove("show");
  clearTimeout(askHintTimer);

  /* 结果区 / 汤底 / 复盘全部隐藏 */
  resultCard.hidden = true;
  verdictEl.textContent = "";
  verdictEl.className = "verdict";
  verdictSub.textContent = "";
  truthBox.hidden = true;
  reviewBox.hidden = true;
  reviewList.textContent = "";
  reviewTip.hidden = true;

  giveUpBtn.disabled = false;
  confirmBtn.disabled = false;

  /* 按新汤重新渲染标题、汤面、难度、提问框示例 */
  initSoup();
  syncAskControls();
  renderBank();
}

/* 点击题库卡片切换汤 */
soupBank.addEventListener("click", function (event) {
  const card = event.target.closest(".soup-card");
  if (card && card.dataset.id) switchSoup(card.dataset.id);
});

/* =========================================================
   13. 启动
   ========================================================= */
initSoup();
updateModeStatus();
syncAskControls();
renderBank();
askInput.focus();
</script>
